name: Orbit tester builds
on:
  push:
    branches: ['codex/tester-build-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-testers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - name: Verify reserved build
        shell: bash
        run: |
          test "${{ github.run_attempt }}" = 1 || { echo 'Reserve a new product build for a retry.'; exit 1; }
          python3 Tools/build-tester.py --verify-reservation
      - name: Fetch pinned dependencies
        shell: bash
        run: |
          git config --global core.autocrlf false
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive --depth 1
          python3 Tools/prepare-dependencies.py
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev
      - name: Compile and package
        shell: bash
        run: python3 Tools/build-tester.py --reserved --platform ${{ matrix.platform }} --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orbit-${{ matrix.platform }}-${{ github.sha }}
          path: |
            Builds/Testers/*.zip
            Builds/Testers/*.tar.gz
            Builds/Testers/*.sha256
          if-no-files-found: error
          retention-days: 30
